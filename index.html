<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Academic OS - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-page">

        <!-- Left Section -->
        <div class="welcome-section">

            <h1>Academic OS</h1>

            <p class="tagline">
                Your academics, intelligently organized.
            </p>

            <p class="description">
                Track your attendance, performance, assignments
                and academic progress — all in one place.
            </p>

        </div>


        <!-- Login Card -->
        <div class="login-card">

            <h2>Welcome back 👋</h2>

            <p class="login-text">
                Login to continue to your academic dashboard.
            </p>


            <!-- Role -->
            <label>I am a</label>

            <div class="roles">
                <button type="button">Student</button>
                <button type="button">Faculty</button>
                <button type="button">Admin</button>
            </div>


            <!-- Email -->
            <label>Email / Student ID</label>

            <input
    type="text"
    id="userId"
    placeholder="Enter your ID or email"
>


            <!-- Password -->
            <label>Password</label>

            <input
    type="password"
    id="password"
    placeholder="Enter your password"
>


            <div class="forgot">
                Forgot password?
            </div>


            <button class="login-btn">
                Login →
            </button>

        </div>

    </div>


    <script src="script.js"></script>
    
</body>

</html>
